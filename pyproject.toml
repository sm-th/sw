[project]
name = "sw"
version = "0"
requires-python = ">=3.13"
dependencies = [
  "chonkie[openai,neural,st]==1.7.0",
  "torch",
  "qdrant-client>=1.15",
  "numpy>=2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
