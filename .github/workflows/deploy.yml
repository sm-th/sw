name: Deploy research

# Called by every published research repository: `uses: sm-th/sw/.github/workflows/deploy.yml@main`.
# The caller grants pages: write and id-token: write.
on:
  workflow_call:
    inputs:
      sw-ref:
        description: Ref of sm-th/sw whose site kit builds the research
        type: string
        default: main

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: sm-th/sw
          ref: ${{ inputs.sw-ref }}
          path: .sw
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix .sw/site
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build under the Pages base path
        run: .sw/bin/sw build --prefix "${{ steps.pages.outputs.base_path }}/" _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
