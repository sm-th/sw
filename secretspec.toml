[project]
name = "sw"
revision = "1.0"

# Values live in one user-level dotenv file, ~/.config/sw/.env by default
# (override with SW_ENV_FILE); sw passes it as the provider. Never commit values.
[providers]
local = "dotenv:~/.config/sw/.env"

[profiles.default.defaults]
providers = ["local"]

[profiles.default]
FIRECRAWL_API_KEY = { description = "Firecrawl API key used by sw fetch to scrape sources" }
R2_ACCOUNT_ID = { description = "Cloudflare account ID that owns the capture bucket" }
R2_BUCKET = { description = "Private R2 bucket for source captures", default = "smith-wiki-sources" }
R2_ACCESS_KEY_ID = { description = "R2 API token access key ID with read and write access to the bucket" }
R2_SECRET_ACCESS_KEY = { description = "R2 API token secret access key" }
OPENROUTER_API_KEY = { description = "OpenRouter API key used by sw fetch and sw search to embed chunks and queries" }
QDRANT_URL = { description = "Qdrant Cloud cluster URL holding the search indexes" }
QDRANT_API_KEY = { description = "Qdrant Cloud API key with read and write access to the cluster" }
